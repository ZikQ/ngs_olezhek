[package]
name = "ngs_olezhek_macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
ngs_olezhek_bundle = { path = "../bundle" }
omnilua = { workspace = true }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
