[package]
name = "ngs_olezhek"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["bundle", "macros", "runtime"]

[workspace.dependencies]
omnilua = { version = "=0.7.2", default-features = false }

[dependencies]
argon2 = "0.6"
base64 = "0.22"
axum = { version = "0.8.9", features = ["ws"] }
getrandom = "0.3"
ngs_olezhek_bundle = { path = "bundle" }
ngs_olezhek_macros = { path = "macros" }
notify = "9"
omnilua = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "cors"] }
rusqlite = { version = "0.43.0", features = ["bundled"], optional = true }
inventory = "0.3.25"
serde_path_to_error = "0.1.20"

[build-dependencies]
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
futures-util = "0.3"
ngs_olezhek = { path = ".", features = ["testing"] }
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "hello"
path = "examples/hello/main.rs"

# Runtime wasm is always built with this profile (see build.rs): debug omnilua is too slow in the browser.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[features]
# Persistent sessions: security::SqliteStore. Builds SQLite from source, so it needs a C compiler.
sqlite = ["dep:rusqlite"]
# ngs_olezhek::testing, for running app Lua natively in tests.
testing = ["omnilua/coroutine", "omnilua/debug", "omnilua/utf8"]
