[package]
name = "ngs_olezhek_runtime"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ngs_olezhek_bundle = { path = "../bundle" }
omnilua = { workspace = true, features = ["coroutine", "utf8", "debug"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = [
    "AbortController",
    "AbortSignal",
    "BinaryType",
    "CssRule",
    "CssRuleList",
    "CssStyleRule",
    "CssStyleSheet",
    "HtmlStyleElement",
    "Storage",
    "StorageEvent",
    "StyleSheet",
    "DomRect",
    "FontFace",
    "FontFaceDescriptors",
    "FontFaceSet",
    "MessageEvent",
    "WebSocket",
    "console",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "FocusEvent",
    "Headers",
    "History",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlImageElement",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Node",
    "Performance",
    "PointerEvent",
    "PopStateEvent",
    "Request",
    "RequestInit",
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "Response",
    "Text",
    "TextMetrics",
    "Window",
]
